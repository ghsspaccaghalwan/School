@media print{.ss td.md select{appearance:none;-webkit-appearance:none;border:0;background:transparent;text-align:center}}
@media print{.ss{margin:0;border-radius:0}.ss td[contenteditable]{box-shadow:none!important}}
</style>
<script>
/* ===== Staff Statement ===== */
const STF0={title:'Staff Statement',msg:'',theme:'blue',sig:0,cols:[],vals:{}};
let STF=Object.assign({},STF0,(()=>{try{return JSON.parse(localStorage.getItem('stf'))||{}}catch(e){return{}}})());
const STH={blue:['#1d4ed8','#0e7490','#dbeafe'],green:['#15803d','#0f766e','#dcfce7'],purple:['#7c3aed','#be185d','#ede9fe'],maroon:['#9f1239','#b45309','#ffe4e6'],orange:['#c2410c','#a16207','#ffedd5']};
const STC=['#dc2626','#16a34a','#7c3aed','#d97706','#0891b2','#be185d'];
const stfSave=()=>sv('stf',STF);
const stfA=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const stfNum=v=>{const n=parseFloat(String(v||'').replace(/,/g,''));return isNaN(n)?0:n};
const stfFmt=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const stfDate=()=>day.split('-').reverse().join('-');
function stfTotals(){const T=TL();return STF.cols.map(c=>c.tot?T.reduce((a,t)=>a+stfNum((STF.vals[c.id]||{})[t]),0):null)}
function stfSheet(){
 const T=TL(),th=STH[STF.theme]||STH.blue,tot=stfTotals(),anyT=tot.some(x=>x!==null);
 let h=`<div class="ss" style="--s1:${th[0]};--s2:${th[1]};--s3:${th[2]}"><div class="ssh"><h2>GOVT. HIGHER SECONDARY SCHOOL PACCA GHALWAN (M.GARH)</h2><div class="sc">School Code: 32330052</div><h3>${esc(STF.title||'Staff Statement')}</h3><div class="sd">Date: ${stfDate()}</div></div>`;
 if(STF.msg.trim())h+=`<div class="ssm">${esc(STF.msg.trim())}</div>`;
 h+=`<div class="sst"><table><tr><th>#</th><th style="text-align:left">Teacher Name</th>${STF.cols.map((c,i)=>`<th style="background:${STC[i%STC.length]}">${esc(c.t||'—')}</th>`).join('')}${STF.sig?'<th style="width:25%">Signature</th>':''}</tr>`;
 T.forEach((t,i)=>{h+=`<tr><td class="n">${i+1}</td><td class="nm">${esc(t)}</td>${STF.cols.map(c=>`<td contenteditable="true" inputmode="decimal" data-c="${c.id}" data-i="${i}" oninput="stfCell(this)">${esc((STF.vals[c.id]||{})[t]||'')}</td>`).join('')}${STF.sig?'<td></td>':''}</tr>`});
 if(anyT)h+=`<tr class="stt"><td colspan="2">TOTAL</td>${STF.cols.map((c,i)=>`<td id="stt${c.id}">${tot[i]===null?'':stfFmt(tot[i])}</td>`).join('')}${STF.sig?'<td></td>':''}</tr>`;
 h+=`</table></div>`;
 let pr='';try{pr=W.princ||''}catch(e){}
 if(STF.sig)h+=`<div class="ssg"><div><span></span>Principal${pr?'<br><b>'+esc(pr)+'</b>':''}</div></div>`;
 return h+`<div class="ssf">Software by: Amanullah Qureshi</div></div>`}
function stfv(){
 return`<div class="card np"><b style="font-size:16px">📋 Staff Statement</b><p style="color:var(--m);margin:6px 0 10px">All teachers are listed automatically. Add a message and extra columns (e.g. Collection (RS)). Tap a cell in the report to type a value.</p>
<div class="stc"><input type="text" id="stT" value="${stfA(STF.title)}" placeholder="Report title" oninput="STF.title=this.value;stfSave();stfRe()"></div>
<div class="stc"><textarea id="stM" rows="3" style="flex:1;width:100%" placeholder="Optional message shown at the top of the report" oninput="STF.msg=this.value;stfSave();stfRe()">${esc(STF.msg)}</textarea></div>
<div class="stc"><label>Colour <select onchange="STF.theme=this.value;stfSave();R()">${Object.keys(STH).map(k=>`<option value="${k}" ${STF.theme==k?'selected':''}>${k[0].toUpperCase()+k.slice(1)}</option>`).join('')}</select></label><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" ${STF.sig?'checked':''} onchange="STF.sig=this.checked?1:0;stfSave();R()"> Signature column</label></div>
<b style="font-size:14px">Extra columns</b>
${STF.cols.map(c=>`<div class="stc"><input type="text" value="${stfA(c.t)}" placeholder="Column title" oninput="stfCol('${c.id}','t',this.value)"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" ${c.tot?'checked':''} onchange="stfCol('${c.id}','tot',this.checked?1:0);R()"> Total</label><button class="btn r" onclick="stfDel('${c.id}')">Delete</button></div>`).join('')||'<p style="color:var(--m);margin:4px 0">No extra column yet.</p>'}
<div class="bar"><button class="btn g" onclick="stfAdd()">➕ Add column</button><button class="btn p" onclick="stfPrint()">🖨 Print / Save PDF (colour)</button><button class="btn" onclick="stfCsv()">⬇ Download Excel (CSV)</button><button class="btn" onclick="stfClear()">Clear column values</button></div></div><div id="stfs">${stfSheet()}</div>`}
function stfRe(){const e=$('#stfs');if(e)e.innerHTML=stfSheet()}
function stfAdd(){const id='c'+Date.now().toString(36);STF.cols.push({id,t:STF.cols.length?'':'Collection (RS)',tot:1});stfSave();R()}
function stfCol(id,k,v){const c=STF.cols.find(x=>x.id==id);if(!c)return;c[k]=v;stfSave();stfRe()}
function stfDel(id){STF.cols=STF.cols.filter(c=>c.id!=id);delete STF.vals[id];stfSave();R()}
function stfClear(){STF.vals={};stfSave();R()}
function stfCell(td){const t=TL()[+td.dataset.i],id=td.dataset.c;(STF.vals[id]=STF.vals[id]||{})[t]=td.textContent.trim();stfSave();const c=STF.cols.find(x=>x.id==id),e=$('#stt'+id);if(c&&c.tot&&e)e.textContent=stfFmt(TL().reduce((a,n)=>a+stfNum((STF.vals[id]||{})[n]),0))}
function stfPrint(){let s=$('#pgs');if(!s){s=document.createElement('style');s.id='pgs';document.head.appendChild(s)}s.textContent='@media print{@page{size:A4 '+(STF.cols.length>3?'landscape':'portrait')+';margin:12mm}}';setTimeout(()=>window.print(),100)}
function stfCsv(){const T=TL(),q=x=>'"'+String(x).replace(/"/g,'""')+'"',tot=stfTotals();let r=[['#','Teacher Name',...STF.cols.map(c=>c.t)].map(q).join(',')];T.forEach((t,i)=>r.push([i+1,t,...STF.cols.map(c=>(STF.vals[c.id]||{})[t]||'')].map(q).join(',')));if(tot.some(x=>x!==null))r.push(['','TOTAL',...tot.map(x=>x===null?'':x)].map(q).join(','));const b=new Blob(['\ufeff'+r.join('\r\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(STF.title||'Staff_Statement').replace(/[^\w]+/g,'_')+'_'+day+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ===== Collection ===== */
const COL0={title:'Collection',msg:'',amt:'',theme:'green',paid:{},exp:[]};
let COL=Object.assign({},COL0,(()=>{try{return JSON.parse(localStorage.getItem('col'))||{}}catch(e){return{}}})());
if(!COL.paid)COL.paid={};if(!Array.isArray(COL.exp))COL.exp=[];
const colSave=()=>sv('col',COL);
const colE=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function colStat(){const T=TL(),a=stfNum(COL.amt);let cash=0,on=0,n=0;T.forEach(t=>{const p=COL.paid[t];if(p){n++;if(p.m=='O')on+=a;else cash+=a}});const ex=COL.exp.reduce((x,e)=>x+stfNum(e.a),0);return{n,tot:T.length,cash,on,col:cash+on,ex,rem:cash+on-ex}}
function colDash(){const S=colStat();return`<div class="card"><b style="color:var(--g)">${stfFmt(S.col)}</b><span>Total Collection (Rs)</span></div><div class="card"><b style="color:var(--r)">${stfFmt(S.ex)}</b><span>Total Expense (Rs)</span></div><div class="card"><b style="color:${S.rem<0?'var(--r)':'var(--p)'}">${stfFmt(S.rem)}</b><span>Remaining (Rs)</span></div><div class="card"><b>${S.n}/${S.tot}</b><span>Teachers Paid</span></div>`}
function colSheet(){
 const T=TL(),th=STH[COL.theme]||STH.green,S=colStat(),a=stfNum(COL.amt);
 let h=`<div class="ss" style="--s1:${th[0]};--s2:${th[1]};--s3:${th[2]}"><div class="ssh"><h2>GOVT. HIGHER SECONDARY SCHOOL PACCA GHALWAN (M.GARH)</h2><div class="sc">School Code: 32330052</div><h3>${colE(COL.title||'Collection')}</h3><div class="sd">Date: ${stfDate()}${a?' • Amount per teacher: Rs '+stfFmt(a):''}</div></div>`;
 if((COL.msg||'').trim())h+=`<div class="ssm">${colE(COL.msg.trim())}</div>`;
 h+=`<div class="sst"><table><tr><th>#</th><th style="text-align:left">Teacher Name</th><th>Paid</th><th>Cash / Online</th><th>Amount</th></tr>`;
 T.forEach((t,i)=>{const p=COL.paid[t];h+=`<tr><td class="n">${i+1}</td><td class="nm">${colE(t)}</td><td class="ck"><input type="checkbox" ${p?'checked':''} onchange="colTick(${i},this.checked)"></td><td class="md">${p?`<select onchange="colMode(${i},this.value)"><option value="C" ${p.m!='O'?'selected':''}>Cash</option><option value="O" ${p.m=='O'?'selected':''}>Online Payment</option></select>`:''}</td><td class="am">${p&&a?stfFmt(a):''}</td></tr>`});
 h+=`<tr class="stt"><td colspan="4">TOTAL COLLECTION (${S.n} of ${S.tot} teachers)</td><td>${stfFmt(S.col)}</td></tr></table></div>`;
 h+=`<div class="sst"><table class="sum"><tr><td>Collected in Cash</td><td>Rs ${stfFmt(S.cash)}</td></tr><tr><td>Collected by Online Payment</td><td>Rs ${stfFmt(S.on)}</td></tr><tr><td>Total Collection</td><td>Rs ${stfFmt(S.col)}</td></tr><tr><td>Total Expense</td><td>− Rs ${stfFmt(S.ex)}</td></tr><tr class="rem"><td>REMAINING AMOUNT (Collection − Expense)</td><td>Rs ${stfFmt(S.rem)}</td></tr></table></div>`;
 if(COL.exp.length){h+=`<div class="exh">Expense Details</div><div class="sst"><table class="exl"><tr><th>#</th><th style="text-align:left">Details</th><th>Date</th><th>Amount</th></tr>${COL.exp.map((e,i)=>`<tr><td class="n">${i+1}</td><td>${colE(e.t||'—')}</td><td style="text-align:center">${colE(e.d||'')}</td><td>${stfFmt(stfNum(e.a))}</td></tr>`).join('')}<tr class="stt"><td colspan="3">TOTAL EXPENSE</td><td>${stfFmt(S.ex)}</td></tr></table></div>`}
 return h+`<div class="ssf">Software by: Amanullah Qureshi</div></div>`}
function colStats(){const S=colStat();return`<div class="grid" style="margin:10px 0"><div class="card"><b style="color:var(--g)">${stfFmt(S.col)}</b><span>Collection (Cash ${stfFmt(S.cash)} • Online ${stfFmt(S.on)})</span></div><div class="card"><b style="color:var(--r)">${stfFmt(S.ex)}</b><span>Expense</span></div><div class="card"><b style="color:${S.rem<0?'var(--r)':'var(--p)'}">${stfFmt(S.rem)}</b><span>Remaining</span></div><div class="card"><b>${S.n}/${S.tot}</b><span>Teachers Paid</span></div></div>`}
function colv(){
 return`<div class="card np"><b style="font-size:16px">💰 Collection</b><p style="color:var(--m);margin:6px 0 10px">Set the amount per teacher, then tick each teacher who has paid and choose Cash or Online Payment. Expenses are subtracted automatically from the remaining amount.</p>
<div class="stc"><input type="text" value="${colE(COL.title)}" placeholder="Title (e.g. Tea Party Collection)" oninput="COL.title=this.value;colSave();colRe()"></div>
<div class="stc"><textarea rows="3" style="flex:1;width:100%" placeholder="Optional message shown at the top of the sheet" oninput="COL.msg=this.value;colSave();colRe()">${colE(COL.msg)}</textarea></div>
<div class="stc"><label>Amount per teacher (Rs) <input type="number" inputmode="decimal" min="0" style="width:120px" value="${colE(COL.amt)}" oninput="COL.amt=this.value;colSave();colRe()"></label><label>Colour <select onchange="COL.theme=this.value;colSave();R()">${Object.keys(STH).map(k=>`<option value="${k}" ${COL.theme==k?'selected':''}>${k[0].toUpperCase()+k.slice(1)}</option>`).join('')}</select></label></div>
<div id="cst">${colStats()}</div>
<b style="font-size:14px">➖ Expense</b>
<div class="stc"><input type="text" id="cex_t" placeholder="Expense details (e.g. Tea, Cake)"><input type="number" id="cex_a" inputmode="decimal" min="0" placeholder="Amount" style="width:110px"><button class="btn r" onclick="colAddExp()">Add Expense</button></div>
${COL.exp.map((e,i)=>`<div class="stc"><span style="flex:1">${i+1}. ${colE(e.t||'—')} <small style="color:var(--m)">${colE(e.d||'')}</small></span><b style="display:inline;font-size:15px">Rs ${stfFmt(stfNum(e.a))}</b><button class="btn" onclick="colDelExp(${i})">Delete</button></div>`).join('')||'<p style="color:var(--m);margin:4px 0">No expense yet.</p>'}
<div class="bar"><button class="btn p" onclick="colPrint()">🖨 Print / Save PDF</button><button class="btn" onclick="colCsv()">⬇ Download Excel (CSV)</button><button class="btn" onclick="colAll()">Tick all (Cash)</button><button class="btn" onclick="colClear()">Clear ticks</button></div></div><div id="cos">${colSheet()}</div>`}
function colRe(){const e=$('#cos');if(e)e.innerHTML=colSheet();const c=$('#cst');if(c)c.innerHTML=colStats()}
function colTick(i,v){const t=TL()[i];if(v)COL.paid[t]={m:(COL.paid[t]||{}).m||'C'};else delete COL.paid[t];colSave();colRe()}
function colMode(i,v){const t=TL()[i];if(COL.paid[t]){COL.paid[t].m=v;colSave();colRe()}}
function colAll(){TL().forEach(t=>{if(!COL.paid[t])COL.paid[t]={m:'C'}});colSave();colRe()}
function colClear(){if(!confirm('Clear all paid ticks?'))return;COL.paid={};colSave();colRe()}
function colAddExp(){const t=$('#cex_t').value.trim(),a=stfNum($('#cex_a').value);if(!a){alert('Enter expense amount');return}COL.exp.push({t,a,d:stfDate()});colSave();R()}
function colDelExp(i){COL.exp.splice(i,1);colSave();R()}
function colPrint(){let s=$('#pgs');if(!s){s=document.createElement('style');s.id='pgs';document.head.appendChild(s)}s.textContent='@media print{@page{size:A4 portrait;margin:12mm}}';setTimeout(()=>window.print(),100)}
function colCsv(){const T=TL(),S=colStat(),a=stfNum(COL.amt),q=x=>'"'+String(x).replace(/"/g,'""')+'"';let r=[['#','Teacher Name','Paid','Mode','Amount'].map(q).join(',')];T.forEach((t,i)=>{const p=COL.paid[t];r.push([i+1,t,p?'Yes':'No',p?(p.m=='O'?'Online':'Cash'):'',p?a:''].map(q).join(','))});r.push(['','Cash','','',S.cash].map(q).join(','));r.push(['','Online','','',S.on].map(q).join(','));r.push(['','TOTAL COLLECTION','','',S.col].map(q).join(','));COL.exp.forEach(e=>r.push(['','Expense: '+e.t,'','',stfNum(e.a)].map(q).join(',')));r.push(['','TOTAL EXPENSE','','',S.ex].map(q).join(','));r.push(['','REMAINING','','',S.rem].map(q).join(','));const b=new Blob(['\ufeff'+r.join('\r\n')],{type:'text/csv'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=(COL.title||'Collection').replace(/[^\w]+/g,'_')+'_'+day+'.csv';document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove()},500)}

const sgToday=()=>{const n=new Date(),p=x=>('0'+x).slice(-2);return p(n.getDate())+'-'+p(n.getMonth()+1)+'-'+n.getFullYear()};
function sigBlock(){let pr='Zahid Khan Kakar';try{pr=W.princ||pr}catch(e){}
 return`<div class="sig sg2"><div class="sgc"><img class="sgi" src="${SIG_IMG}" alt="Signature of Timetable Incharge"><div class="sgh"><span class="sgdv">${sgToday()}</span></div><span></span><div class="sgr">Timetable Incharge</div><b>Shabir Ahmad</b></div><div class="sgc"><div class="sgsp"></div><span></span><div class="sgr">Principal GHSS Pacca Ghalwan</div><b>${pr}</b></div></div>`}
/* the date is always today's date; refresh it right before printing so it is never stale */
window.addEventListener('beforeprint',()=>document.querySelectorAll('.sgdv').forEach(e=>e.textContent=sgToday()));

/* ===== Expense (separate from Collection) ===== */
const EXP0={title:'Expense Report',msg:'',theme:'maroon',items:[],from:'',to:''};
let EXP=Object.assign({},EXP0,(()=>{try{return JSON.parse(localStorage.getItem('exp'))||{}}catch(e){return{}}})());
if(!Array.isArray(EXP.items))EXP.items=[];
const expSave=()=>sv('exp',EXP);
const expD=d=>d?d.split('-').reverse().join('-'):'';
function expList(){return EXP.items.filter(e=>(!EXP.from||e.d>=EXP.from)&&(!EXP.to||e.d<=EXP.to)).slice().sort((a,b)=>(a.d||'').localeCompare(b.d||'')||a.id-b.id)}
function expTotal(){return expList().reduce((a,e)=>a+stfNum(e.a),0)}
function expRange(){return EXP.from||EXP.to?(EXP.from?expD(EXP.from):'start')+' to '+(EXP.to?expD(EXP.to):'today'):'All dates'}
function expSheet(){
 const th=STH[EXP.theme]||STH.maroon,L=expList(),tot=expTotal();
 let h=`<div class="ss" style="--s1:${th[0]};--s2:${th[1]};--s3:${th[2]}"><div class="ssh"><h2>GOVT. HIGHER SECONDARY SCHOOL PACCA GHALWAN (M.GARH)</h2><div class="sc">School Code: 32330052</div><h3>${colE(EXP.title||'Expense Report')}</h3><div class="sd">Period: ${expRange()}</div></div>`;
 if((EXP.msg||'').trim())h+=`<div class="ssm">${colE(EXP.msg.trim())}</div>`;
 h+=`<div class="sst"><table class="exl"><tr><th>#</th><th style="text-align:left">Expense Details</th><th>Date</th><th>Amount (Rs)</th></tr>${L.map((e,i)=>`<tr><td class="n">${i+1}</td><td class="nm">${colE(e.t||'—')}</td><td style="text-align:center">${expD(e.d)}</td><td>${stfFmt(stfNum(e.a))}</td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center">No expense recorded.</td></tr>'}<tr class="stt"><td colspan="3">TOTAL EXPENSE (${L.length} ${L.length==1?'entry':'entries'})</td><td>Rs ${stfFmt(tot)}</td></tr></table></div>`;
 let pr='Zahid Khan Kakar';try{pr=W.princ||pr}catch(e){}
 h+=`<div class="ssg"><div><span></span>Principal GHSS Pacca Ghalwan<br><b>${colE(pr)}</b></div></div>`;
 return h+`<div class="ssf">Software by: Amanullah Qureshi</div></div>`}
function expStats(){const L=expList();return`<div class="grid" style="margin:10px 0"><div class="card"><b style="color:var(--r)">${stfFmt(expTotal())}</b><span>Total Expense (Rs)</span></div><div class="card"><b>${L.length}</b><span>Entries in report</span></div></div>`}
function expv(){
 const L=EXP.items.slice().sort((a,b)=>(b.d||'').localeCompare(a.d||'')||b.id-a.id);
 return`<div class="card np"><b style="font-size:16px">💸 Expense</b><p style="color:var(--m);margin:6px 0 10px">Record school expenses here. This is separate from Collection, and its report is printed on its own.</p>
<div class="stc"><input type="text" value="${colE(EXP.title)}" placeholder="Report title" oninput="EXP.title=this.value;expSave();expRe()"></div>
<div class="stc"><textarea rows="2" style="flex:1;width:100%" placeholder="Optional message shown at the top of the report" oninput="EXP.msg=this.value;expSave();expRe()">${colE(EXP.msg)}</textarea></div>
<div class="stc"><label>Colour <select onchange="EXP.theme=this.value;expSave();R()">${Object.keys(STH).map(k=>`<option value="${k}" ${EXP.theme==k?'selected':''}>${k[0].toUpperCase()+k.slice(1)}</option>`).join('')}</select></label><label>Report from <input type="date" value="${EXP.from}" onchange="EXP.from=this.value;expSave();expRe()"></label><label>to <input type="date" value="${EXP.to}" onchange="EXP.to=this.value;expSave();expRe()"></label><button class="btn" onclick="EXP.from=EXP.to='';expSave();R()">All dates</button></div>
<div id="exs">${expStats()}</div>
<b style="font-size:14px">➕ Add expense</b>
<div class="stc"><input type="date" id="ex_d" value="${day}"><input type="text" id="ex_t" placeholder="Details (e.g. Stationery, Repair)"><input type="number" id="ex_a" inputmode="decimal" min="0" placeholder="Amount" style="width:110px"><button class="btn r" onclick="expAdd()">Add</button></div>
${L.map(e=>`<div class="stc"><input type="date" value="${colE(e.d)}" style="width:150px" onchange="expEdit(${e.id},'d',this.value)"><input type="text" value="${colE(e.t)}" placeholder="Details" onchange="expEdit(${e.id},'t',this.value)"><input type="number" inputmode="decimal" min="0" value="${colE(e.a)}" style="width:110px" onchange="expEdit(${e.id},'a',this.value)"><button class="btn" onclick="expDel(${e.id})">Delete</button></div>`).join('')||'<p style="color:var(--m);margin:4px 0">No expense yet.</p>'}
<div class="bar"><button class="btn p" onclick="colPrint()">🖨 Print / Save PDF</button><button class="btn" onclick="expCsv()">⬇ Download Excel (CSV)</button><button class="btn r" onclick="expClear()">Clear all expenses</button></div></div><div id="exr">${expSheet()}</div>`}
function expRe(){const e=$('#exr');if(e)e.innerHTML=expSheet();const c=$('#exs');if(c)c.innerHTML=expStats()}
function expAdd(){const t=$('#ex_t').value.trim(),a=stfNum($('#ex_a').value),d=$('#ex_d').value||day;if(!a){alert('Enter expense amount');return}EXP.items.push({id:Date.now(),t,a,d});expSave();R()}
function expEdit(id,k,v){const e=EXP.items.find(x=>x.id==id);if(!e)return;e[k]=k=='a'?stfNum(v):v;expSave();expRe()}
function expDel(id){EXP.items=EXP.items.filter(x=>x.id!=id);expSave();R()}
function expClear(){if(!EXP.items.length||!confirm('Delete ALL expense entries?'))return;EXP.items=[];expSave();R()}
function expCsv(){const L=expList(),q=x=>'"'+String(x).replace(/"/g,'""')+'"';let r=[['#','Date','Expense Details','Amount'].map(q).join(',')];L.forEach((e,i)=>r.push([i+1,expD(e.d),e.t,stfNum(e.a)].map(q).join(',')));r.push(['','','TOTAL EXPENSE',expTotal()].map(q).join(','));const b=new Blob(['\ufeff'+r.join('\r\n')],{type:'text/csv'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=(EXP.title||'Expense_Report').replace(/[^\w]+/g,'_')+'_'+day+'.csv';document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove()},500)}

/* ===== Urdu auto-detect: font, right-to-left, centred in cells ===== */
const URX=/[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/;
function urOne(e){if(!e||!e.tagName)return;const t=e.tagName,f=t=='INPUT'||t=='TEXTAREA';if(f){if(t=='INPUT'&&!/^(text|search|)$/.test(e.type))return;e.setAttribute('dir','auto');e.classList.toggle('ur',URX.test(e.value||''));return}
 const h=URX.test(e.textContent||'');e.classList.toggle('ur',h);if(h)e.setAttribute('dir','auto');else if(e.getAttribute('dir')=='auto')e.removeAttribute('dir')}
function urFix(){document.querySelectorAll('td,th,p,input,textarea,.ssm,.wmsg,h2,h3').forEach(urOne)}
let urT=0;new MutationObserver(()=>{clearTimeout(urT);urT=setTimeout(urFix,40)}).observe(document.body,{childList:true,subtree:true,characterData:true});
document.addEventListener('input',e=>{urOne(e.target);if(e.target.closest&&e.target.closest('td,th'))urOne(e.target.closest('td,th'))});
setTimeout(urFix,0);

/* ===== Notice / Office Letter ===== */
const NTC0={d:'',msg:''};
let NTC=Object.assign({},NTC0,(()=>{try{return JSON.parse(localStorage.getItem('ntc'))||{}}catch(e){return{}}})());
const ntSave=()=>sv('ntc',NTC);
const ntDate=()=>NTC.d||(()=>{const n=new Date(),p=x=>('0'+x).slice(-2);return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())})();
function ntSheet(){let pr='Zahid Khan Kakar';try{pr=W.princ||pr}catch(e){}
